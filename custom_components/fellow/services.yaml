heat_to:
  name: Heat to temperature
  description: >-
    Set the kettle's target temperature and start heating, in one action.
    The temperature is interpreted in the unit configured for the kettle.
  target:
    entity:
      integration: fellow
      domain: water_heater
  fields:
    temperature:
      name: Temperature
      description: Target temperature (40-100 °C / 104-212 °F).
      required: true
      example: 95
      selector:
        number:
          min: 40
          max: 212
          step: 0.5
          mode: box
